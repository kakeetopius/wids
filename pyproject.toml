[project]
name = "wids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kakeetopius", email = "pius.kakeeto@strathmore.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
wids = "wids:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
