<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · WIDS Console</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark">W</span>
        <span>
          <strong>WIDS Console</strong>
          <small>Wireless security</small>
        </span>
      </a>

      <div class="nav-label">Workspace</div>
      <nav class="nav">
        <a class="{% if active_page == 'overview' %}active{% endif %}" href="/">
          <span class="nav-icon">◫</span> Overview
        </a>
        <a class="{% if active_page == 'detections' %}active{% endif %}" href="/detections">
          <span class="nav-icon">≡</span> Detections
        </a>
        <a class="{% if active_page == 'model' %}active{% endif %}" href="/model">
          <span class="nav-icon">⌘</span> Model
        </a>
        <a class="{% if active_page == 'dataset' %}active{% endif %}" href="/dataset">
          <span class="nav-icon">▤</span> Dataset
        </a>
      </nav>

      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <span>
          <strong>Development mode</strong>
          <small>Detection engine not connected</small>
        </span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">WIDS <span>/</span> {{ page_title }}</div>
        <div class="topbar-right"><span class="environment">LOCAL</span></div>
      </header>
      <section class="page-content">
        {% block content %}{% endblock %}
      </section>
      <footer class="footer">
        <span>WIDS Console</span>
        <span>Prototype · Data and metrics are not yet connected</span>
      </footer>
    </main>
  </div>
</body>
</html>
